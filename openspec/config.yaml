schema: spec-driven

context: |
  Write all repository artifacts in English. Never modify any README file.
  THIS IS A LEARNING PROJECT. Follow docs/project-manifesto.md: happy path until the first connected pilot, with narrow scope and idiomatic, typed code.
  The owner is an experienced Java engineer learning Python AI engineering and writes application code/tests unless explicitly delegated. Documentation work does not authorize implementation.
  Current workflow guide: docs/requirements/spec-workflow.md. Earlier openspec/README.md setup/status prose is historical; do not use it as current delivery status.
  docs/domain/model.md owns current entity fields and ingestion contracts. Current owner decisions override historical ADR proposals; ADRs record accepted choices, not implementation by themselves.
  Fictional domain: stones are pets. Staff-authored personalities, health, experiences and wishes are valid facts; keep fictional reference rules distinct from geology.
  Installed baseline: Python 3.13, uv, FastAPI, Pydantic, SQLAlchemy async, asyncpg, Alembic, pytest/pytest-asyncio, Ruff, mypy, and Testcontainers. Check pyproject.toml and source before proposing libraries.
  PY-001/002/003/007/008/009/010 delivered the foundation, domain/data design, and current single-stone registration. Historical issue text must not replace the current contract. PY-011 is active; projection/export and search engines are not connected.
  POST /api/v1/stones accepts one stone, required shelterCase, optional profile. The case includes required source-owned adoptionStatus/currentShelterId and 1 to 100 events containing ADMITTED anywhere. No multi-stone API batch and no replay-derived status/location.
  AdoptionStatus is AVAILABLE, RESERVED, ADOPTED, RETURNED. UNDER_REVIEW is superseded. One lifetime case retains its external UUID and opaque unique case number across returns/transfers. Admission date belongs to the case, not Stone.
  DTOs map directly to ORM graphs; no intermediate domain dataclasses. One UoW session and explicit commit save the entire graph; repositories do not commit.
  Profiles use the implemented socialization enum set (omitted means empty), nullable care enum, health/trigger/environment text. Unknown values are not positive suitability claims. Exact fields/vocabularies live in docs/domain/model.md.
  Local application PostgreSQL is persistent under ADR-0014. Preserve its data/volume. Database-backed automated tests and migration verification use clean Testcontainers only; no fallback to .env. A dedicated two-independent-UoW isolation test remains unverified.
  Current fixtures are fixtures/stones/<stone.externalId>.json, ten valid records; a separate seed loads two shelters. The loader sends one HTTP request per file without automatic retry or duplicate skipping.
  Typesense lexical and Qdrant vectors are selected, not installed integrations. Prepare source evidence, index both, connect LangChain and minimal LangGraph, answer with citations and minimum useful Langfuse tracing. Check current PostgreSQL state before actionable recommendations; use explicit metadata filters in both index branches and PostgreSQL for purely structured requests.
  Ollama/langchain-ollama, OpenRouter and Langfuse Cloud Hobby are selected future integrations. Select models/credentials and authorize provider spending explicitly; keep live inference out of make check.
  Full evaluation harness, held-out datasets, reranking, version machinery, outbox/workers, retries/failure matrices, broad agent autonomy and backend/model comparisons are post-pilot. PY-017 does not block PY-018. PY-022 has a minimal pilot slice before later agent experiments.
  Later profile/update/event-append APIs, physical CRUD completeness, UI/auth, photos, Redis, Kafka, Hypothesis, true token streaming, compatibility/astral sources and Spring AI are not pilot prerequisites. Physical deletion is superseded, not a pending product requirement.
  GitHub Issues and the Stone Shelter Python board own delivery status. docs/search/pilot-delivery-plan.md defines scope slices/dependencies, not a second live board.
  Search model implementation remains in the local PY-011 feature worktree; the documented source examples are design artifacts, not working retrieval. Do not claim a commit, push, merge or successful test without evidence.

rules:
  proposal:
    - Link the GitHub issue and state the pilot scope and deferred experiments separately.
  specs:
    - Describe observable guarantees with SHALL requirements and WHEN/THEN scenarios.
    - Compare against docs/domain/model.md and current accepted owner decisions; do not revive superseded batch or status-replay contracts.
    - Do not introduce hypothetical failure support or future product behavior to satisfy a template.
  design:
    - Reference accepted ADRs and the project manifesto; distinguish decisions, proposals, local drafts and implementation evidence.
  tasks:
    - Leave implementation tasks unchecked until implementation and verification have evidence.
    - Keep unverified/deferred checks explicit; pilot completion does not mark future experiments complete.

operations:
  apply:
    guidance:
      - Explain and review owner-written code unless implementation is explicitly delegated. Keep the current pilot narrow.
  archive:
    guidance:
      - Archive only when the relevant agreed scope is implemented/verified and the owner requests it; preserve deferred checks and historical evidence.
